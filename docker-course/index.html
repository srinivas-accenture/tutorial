<h1>Docker, from your first container to production and the DCA.</h1>
<p>Ten days in two weeks, run as three tracks at once: <b>how Docker really works</b> (architecture and Linux internals), <b>hands-on production Docker</b> for React, FastAPI, Redis and PostgreSQL stacks, and <b>Docker Certified Associate (DCA) preparation</b> with scenario questions and a mock exam.</p>
<a class="cta" href="#d1-why-containers">Start at Day 1</a><a class="cta alt" id="cont" href="#" hidden>Continue where you left off</a><a class="cta alt" href="#exam">DCA exam map</a><a class="cta alt" href="#glossary">Glossary</a>
</div>

<h2>How every topic is taught</h2>
<ol class="pts">
<li><b>What it is</b>, twice: an “Explain like I’m 5” tab for the mental model and a technical tab for the exact behavior.</li>
<li><b>Why it exists</b>: the problem it solves.</li>
<li><b>Architecture</b>: a diagram with numbered steps.</li>
<li><b>Commands</b>: copy-paste commands with typical output.</li>
<li><b>What happens internally</b>: what the Engine, containerd, runc and the kernel do.</li>
<li><b>Production example</b>: how the topic shows up in a real deployment.</li>
<li><b>Certification &amp; interview questions</b> with model answers. The DCA badge marks exam-style questions.</li>
</ol>
<p>After the seven steps come hidden edge cases, best practices, a <b>hands-on lab</b> and a two-minute “teach it” script. Each day ends with a scenario quiz.</p>

<h2>Before you start</h2>
<ul class="pts">
<li><b>Install Docker.</b> Use Docker Desktop on macOS or Windows, or Docker Engine on Linux. Check it with <code>docker version</code> and <code>docker run --rm hello-world</code>.</li>
<li><b>Type the commands; don't just read them.</b> The DCA tests real-world use. Each lab says what “done” looks like.</li>
<li><b>Linux internals labs</b> (namespaces, cgroups, <code>/proc</code>) work best on a Linux host or VM. Docker Desktop runs containers inside a small Linux VM, so some host-level paths differ there.</li>
<li><b>About the DCA:</b> it is aimed at people with roughly 6–12 months of Docker experience. These ten days build the full foundation. Pass the exam by repeating the labs and the mock exam until the answers are automatic. Check the current official exam guide for format, weights and availability before you book.</li>
<li>A <b>revision sheet</b> closes every week. Progress is saved in this browser. Use Print (Ctrl/Cmd+P) for a clean copy.</li>
</ul>
