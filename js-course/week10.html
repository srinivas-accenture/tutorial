{n:49,title:"Graphics and device APIs",goal:"Draw and animate in the browser and use platform capabilities responsibly with progressive enhancement.",topics:[
{id:"d49-graphics-animation",title:"Canvas, SVG and animation",lv:["mid","senior"],
eli5:`<p><b>Canvas</b> is a <b>painting</b>: once you've painted a circle, it's just colored pixels; to move it you repaint everything. <b>SVG</b> is a <b>stack of cut-out shapes</b> you can pick up and move individually, and they stay sharp at any size. <b>Animation</b> is flipping many slightly different pictures fast enough to look like motion; you want to flip them in time with the screen.</p>`,
why:`<p>Charts, games, editors, image processing and rich UI effects need graphics APIs. Choosing between DOM, SVG, Canvas and WebGL, and animating without jank, are common frontend design questions.</p>`,
tech:`<table><tr><th>Technology</th><th>Model</th><th>Best for</th><th>Watch out</th></tr><tr><td>DOM/CSS</td><td>elements + styles</td><td>UI, simple animation</td><td>thousands of nodes get slow</td></tr><tr><td>SVG</td><td>retained vector shapes in the DOM</td><td>icons, charts, diagrams, accessibility, crisp scaling</td><td>performance drops with many thousands of elements</td></tr><tr><td>Canvas 2D</td><td>immediate-mode pixels</td><td>games, big scatter plots, image processing</td><td>no built-in accessibility or hit testing; manual redraw</td></tr><tr><td>WebGL/WebGPU</td><td>GPU pipelines and shaders</td><td>3D, huge data visualizations, effects</td><td>complexity; use Three.js/regl/libraries</td></tr></table>
<ul class="pts"><li><b>Canvas 2D:</b> <code>getContext("2d")</code>, paths (<code>beginPath, moveTo, lineTo, arc, fill, stroke</code>), transforms (<code>save/restore, translate, rotate, scale</code>), <code>drawImage</code>, <code>getImageData/putImageData</code> for pixels, <code>isPointInPath</code> for hit testing. <b>HiDPI:</b> scale the backing store by <code>devicePixelRatio</code> and the context by the same factor. <b>OffscreenCanvas</b> renders in a worker.</li><li><b>SVG:</b> create elements with the SVG namespace (<code>createElementNS</code>); <code>document.createElement("circle")</code> gives a useless HTML element. Style with CSS, animate with CSS/WAAPI.</li><li><b>Animation:</b> prefer <b>CSS transitions/animations</b> and the <b>Web Animations API</b> (<code>el.animate(keyframes, options)</code>) for compositor-friendly <code>transform</code>/<code>opacity</code>; use <code>requestAnimationFrame</code> for custom rendering.</li><li><b>Game loops:</b> use the timestamp rAF gives you (not a fixed 16 ms), clamp large deltas (tab was hidden), and run physics with a <b>fixed timestep</b> accumulator for determinism, rendering with an interpolation alpha.</li><li><b>Easing:</b> map progress t∈[0,1] with functions like ease-in-out cubic; <b>interpolate</b> with <code>lerp(a, b, t) = a + (b - a) * t</code>.</li><li><b>Performance:</b> batch draw calls, avoid per-frame allocations, layer static content on a second canvas, skip offscreen work, respect <code>prefers-reduced-motion</code>.</li></ul>`,
diagram:{html:flow([["rAF(timestamp)"],["dt = now - last","clamp to 250 ms","w"],["accumulate dt","w"],["while acc ≥ 10 ms: update(10)","fixed step physics","g"],["render(alpha = acc/10)","interpolate","g"]]),steps:["The browser calls your callback before each paint with a high-resolution time.","Clamp huge gaps so a backgrounded tab doesn't trigger thousands of steps.","Physics advances in equal slices, keeping simulations stable and reproducible.","Rendering draws the state interpolated by the leftover fraction for smooth motion."]},
ex:[{t:"Canvas pixels, SVG namespaces, easing and a fixed-timestep loop (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const canvas = document.createElement("canvas"); canvas.width = 4; canvas.height = 4;
const ctx = canvas.getContext("2d", { willReadFrequently: true });
ctx.fillStyle = "#ff0000"; ctx.fillRect(0, 0, 2, 2);
check("a painted pixel has the fill color", [...ctx.getImageData(0, 0, 1, 1).data].join() === "255,0,0,255");
check("an unpainted pixel is transparent black", [...ctx.getImageData(3, 3, 1, 1).data].join() === "0,0,0,0");
ctx.beginPath(); ctx.rect(0, 0, 10, 10);
check("hit testing with isPointInPath", ctx.isPointInPath(5, 5) && !ctx.isPointInPath(20, 20));
const img = ctx.getImageData(0, 0, 1, 1); img.data[0] = 0; img.data[2] = 255; ctx.putImageData(img, 0, 0);
check("pixels can be edited directly (ImageData)", [...ctx.getImageData(0, 0, 1, 1).data].join() === "0,0,255,255");
const scaleCanvas = (c, w, h, dpr) => { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.width = w + "px"; c.style.height = h + "px"; const x = c.getContext("2d"); x.scale(dpr, dpr); return x; };
const c2 = document.createElement("canvas"); scaleCanvas(c2, 100, 50, 2);
check("HiDPI: backing store is dpr times the CSS size", c2.width === 200 && c2.height === 100 && c2.style.width === "100px");
const SVG = "http://www.w3.org/2000/svg";
const doc = document.implementation.createHTMLDocument("");
const svg = doc.createElementNS(SVG, "svg"), circle = doc.createElementNS(SVG, "circle"); circle.setAttribute("r", "5"); svg.append(circle);
check("SVG elements need the SVG namespace", svg instanceof SVGElement && circle.namespaceURI === SVG && !(doc.createElement("circle") instanceof SVGElement));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
check("lerp and easing hit the endpoints and the midpoint", lerp(10, 20, 0.5) === 15 && easeInOutCubic(0) === 0 && easeInOutCubic(1) === 1 && easeInOutCubic(0.5) === 0.5 && easeInOutCubic(0.25) < 0.25);
const createLoop = (step, fixed = 10) => { let acc = 0, steps = 0; return { frame(dt){ acc += Math.min(dt, 250); while (acc >= fixed) { step(fixed); acc -= fixed; steps++; } return acc / fixed; }, get steps(){ return steps; } }; };
let simTime = 0; const loop = createLoop((dt) => (simTime += dt));
[16, 17, 16, 50].forEach((dt) => loop.frame(dt));
check("fixed timestep: 99 ms of frames run exactly 9 physics steps", loop.steps === 9 && simTime === 90);
const l2 = createLoop(() => {}); l2.frame(10000);
check("long pauses are clamped (no spiral of death)", l2.steps === 25);`},
{t:"Web Animations API and a rAF loop (reference)",code:`// Compositor-friendly animation without CSS files
const anim = box.animate(
  [{ transform: "translateX(0)", opacity: 1 }, { transform: "translateX(200px)", opacity: 0.4 }],
  { duration: 600, easing: "ease-in-out", fill: "forwards" }
);
anim.finished.then(() => console.log("done"));        // also: anim.pause(), reverse(), playbackRate

// Respect user preferences
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) anim.finish();

// Custom canvas loop
let last = performance.now();
function frame(now){
  const dt = Math.min(now - last, 250); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener("visibilitychange", () => { last = performance.now(); });   // avoid a huge dt after returning to the tab`,run:false}],
gotchas:[`<code>document.createElement("circle")</code> creates an HTML element; SVG needs <code>createElementNS</code>.`,`Canvas content is invisible to screen readers: provide a text alternative or an accessible parallel structure.`,`Not scaling for <code>devicePixelRatio</code> makes canvas content blurry on HiDPI screens.`,`Using <code>setInterval</code> for animation causes jank and wasted work in hidden tabs; use rAF.`,`Animating layout properties (<code>top/left/width</code>) forces layout each frame; animate <code>transform</code>/<code>opacity</code>.`,`Not clamping <code>dt</code> after the tab was hidden causes huge jumps.`,`Allocating objects every frame triggers GC pauses (Day 22).`],
best:[`Pick the simplest technology that meets the requirement: DOM/CSS first, SVG for vector/accessible graphics, Canvas for many objects/pixels, WebGL for 3D/GPU.`,`Use CSS/WAAPI for UI motion; rAF + fixed timestep for simulations; honor reduced-motion.`,`Use libraries (D3, Three.js, PixiJS) for complex scenes.`],
iq:[["mid","Canvas vs SVG: how do you choose?","SVG for a modest number of accessible, scalable, styleable shapes with built-in hit testing; Canvas for thousands of objects, games or pixel manipulation, accepting manual redraw and accessibility work."],["senior","How do you build a smooth game/animation loop?","requestAnimationFrame with real timestamps, clamped delta time, fixed-timestep physics with an accumulator, interpolated rendering, no per-frame allocations, and pause handling for hidden tabs."],["senior","Why is transform better than left/top for animation?","Transform/opacity can be handled by the compositor without layout or paint once promoted to a layer; left/top trigger layout every frame."]],
practice:[`Draw a bar chart on canvas that is crisp on HiDPI and has an accessible data table alternative.`,`Build a bouncing-ball simulation with a fixed timestep and render interpolation.`],
teach:`<p>"Canvas is a painting (fast, but you repaint), SVG is movable cut-outs (accessible, sharp), and animation should follow the screen's refresh with real time, not guesses. Animate transform and opacity."</p>`},

{id:"d49-device-apis",title:"Device and platform APIs and progressive enhancement",lv:["mid","senior","architect"],
eli5:`<p>Browsers can do things like find your location, send notifications, share things and talk between tabs. But these are like <b>asking someone for a favor</b>: ask politely at the right moment ("to show nearby stores, may I use your location?"), accept "no" gracefully, and have a plan B. <b>Progressive enhancement</b> means the page works for everyone and gets better where the favor is granted.</p>`,
why:`<p>Platform APIs vary by browser, device and permission. Robust apps feature-detect, request permission in context, handle denial, and degrade gracefully; privacy missteps lose user trust and can be policy violations.</p>`,
tech:`<ul class="pts"><li><b>Feature detection</b> (never user-agent sniffing): <code>"geolocation" in navigator</code>, <code>typeof BroadcastChannel === "function"</code>, <code>CSS.supports()</code>. Provide fallbacks.</li><li><b>Secure contexts:</b> HTTPS (and localhost) is required for service workers, clipboard, geolocation, crypto.subtle, notifications and more.</li><li><b>Permissions:</b> ask <b>after a user gesture and in context</b>; check state with <code>navigator.permissions.query</code>; handle <code>denied</code> (don't re-prompt repeatedly) and <code>prompt</code>; explain why before the browser prompt.</li><li><b>Geolocation:</b> <code>getCurrentPosition</code>/<code>watchPosition</code> with timeout and accuracy options; errors: permission denied, unavailable, timeout; stop watching to save battery.</li><li><b>Notifications and Push:</b> <code>Notification.requestPermission()</code> + a service worker with the Push API (VAPID keys, server sends via the push service); iOS requires an installed web app. Don't prompt on page load.</li><li><b>Cross-tab coordination:</b> <code>BroadcastChannel</code> (messages between same-origin tabs/workers), <code>storage</code> events, <code>SharedWorker</code>, <b>Web Locks</b> (<code>navigator.locks.request(name, fn)</code>) to serialize work (single leader tab, avoid duplicate sync).</li><li><b>Environment:</b> <code>matchMedia</code> (<code>prefers-color-scheme</code>, <code>prefers-reduced-motion</code>, breakpoints), Page Visibility (<code>document.visibilityState</code>), Online/Offline events (unreliable: "online" doesn't mean the server is reachable), <code>navigator.connection</code> (Chromium), Screen Wake Lock, Fullscreen, Web Share (<code>navigator.share</code>), Vibration, Battery (mostly removed for privacy).</li><li><b>WebRTC:</b> peer-to-peer audio/video/data via <code>RTCPeerConnection</code>; needs a <b>signaling</b> channel you build (WebSocket) to exchange offers/answers and ICE candidates, <b>STUN</b> for NAT discovery and <b>TURN</b> relays as a fallback.</li><li><b>Privacy:</b> request the minimum, explain the benefit, don't fingerprint, honor denials, and document data use.</li></ul>`,
diagram:{html:flow([["feature detect","exists in this browser?"],["explain why","in context, after a gesture","w"],["request permission","w"],["granted → use API","g"],["denied / unsupported → fallback","manual city entry, copy link…","r"]]),steps:["Check support first so unsupported browsers get a working fallback.","Ask only when the user is doing something that needs it, with a clear reason.","Handle each outcome: granted, denied, dismissed and error.","Never make core functionality depend on an optional capability."]},
ex:[{t:"Feature detection, locks, broadcast channels and a graceful geolocation wrapper (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const features = {
  geolocation: "geolocation" in navigator, notifications: "Notification" in window, clipboard: !!navigator.clipboard,
  share: !!navigator.share, broadcast: typeof BroadcastChannel === "function", locks: !!navigator.locks,
  serviceWorker: "serviceWorker" in navigator, webrtc: typeof RTCPeerConnection === "function"
};
console.log(features);
check("feature detection yields booleans (never throws)", Object.values(features).every((v) => typeof v === "boolean"));
check("media queries are available and boolean", matchMedia("(min-width: 1px)").matches === true && typeof matchMedia("(prefers-reduced-motion: reduce)").matches === "boolean");
function getLocation({ geo = navigator.geolocation, timeoutMs = 5000 } = {}){
  if (!geo) return Promise.resolve({ ok: false, reason: "unsupported" });
  return new Promise((resolve) => geo.getCurrentPosition(
    (p) => resolve({ ok: true, coords: p.coords }),
    (e) => resolve({ ok: false, reason: e.code === 1 ? "denied" : e.code === 3 ? "timeout" : "unavailable" }),
    { timeout: timeoutMs }));
}
(async () => {
  check("unsupported browsers get a clean result", (await getLocation({ geo: null })).reason === "unsupported");
  check("success path", (await getLocation({ geo: { getCurrentPosition: (ok) => ok({ coords: { latitude: 1, longitude: 2 } }) } })).coords.latitude === 1);
  check("denied is reported distinctly from errors", (await getLocation({ geo: { getCurrentPosition: (_, bad) => bad({ code: 1 }) } })).reason === "denied");
  check("timeouts are reported distinctly", (await getLocation({ geo: { getCurrentPosition: (_, bad) => bad({ code: 3 }) } })).reason === "timeout");
  if (features.broadcast) {
    const a = new BroadcastChannel("demo"), b = new BroadcastChannel("demo");
    const got = await new Promise((resolve) => { b.onmessage = (e) => resolve(e.data); a.postMessage({ hello: "tab" }); });
    check("BroadcastChannel delivers to other instances (like other tabs)", got.hello === "tab");
    a.close(); b.close();
  } else console.log("skip  BroadcastChannel unavailable");
  if (features.locks) {
    const order = [];
    await Promise.all([
      navigator.locks.request("res", async () => { order.push("a-start"); await sleep(10); order.push("a-end"); }),
      navigator.locks.request("res", async () => { order.push("b-start"); order.push("b-end"); })
    ]);
    check("Web Locks serialize work on the same resource name", order.join() === "a-start,a-end,b-start,b-end");
  } else console.log("skip  Web Locks unavailable");
})();`},
{t:"Permission-friendly notifications and visibility (reference)",code:`// Ask in context, after a click, and handle every outcome
async function enableReminders(){
  if (!("Notification" in window)) return showFallback("Email reminders instead");
  if (Notification.permission === "denied") return showHelp("Notifications are blocked. Enable them in site settings.");
  const result = await Notification.requestPermission();         // must come from a user gesture
  if (result !== "granted") return showFallback("No problem, we'll email you.");
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: VAPID_PUBLIC_KEY });
  await fetch("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub), headers: { "Content-Type": "application/json" } });
}

// Pause work when the tab is hidden
document.addEventListener("visibilitychange", () => {
  document.visibilityState === "hidden" ? pausePolling() : resumePolling();
});

// Online/offline events are hints only: "online" doesn't mean your server is reachable
addEventListener("offline", () => banner.show("You're offline: changes will sync later"));`,run:false}],
gotchas:[`Prompting for permissions on page load gets denied and trains users to block; ask in context.`,`A denied permission usually can't be re-requested by code; show instructions to change it in settings.`,`<code>navigator.onLine</code> true doesn't guarantee connectivity; handle fetch failures.`,`Many APIs require a secure context and a user gesture; they fail silently or throw in tests.`,`Browser support varies widely (Web Share, Push on iOS, Battery, Bluetooth, USB); always feature-detect and provide a fallback.`,`Leaving <code>watchPosition</code> or WebRTC streams running drains battery and keeps the camera light on.`,`WebRTC without TURN fails for a notable share of users behind strict NATs.`],
best:[`Treat platform APIs as progressive enhancements; the core flow must work without them.`,`Explain the benefit before the permission prompt; remember denials and don't nag.`,`Clean up (clearWatch, stop tracks, close channels) when done.`],
iq:[["mid","How do you use a browser API safely across browsers?","Feature-detect (not user-agent), require secure contexts where needed, handle permission denial and errors, provide a fallback or degrade the feature, and keep the core flow independent."],["senior","How would you coordinate multiple tabs?","BroadcastChannel for messaging, Web Locks to elect a leader or serialize work, storage events as a fallback, and a shared worker or service worker for shared connections."],["architect","How do you design permission UX for notifications?","Ask only after a clear value moment and user gesture, show a pre-permission explanation, handle granted/denied/dismissed, offer alternatives (email, in-app), provide settings to change preferences, and monitor opt-in rates."]],
practice:[`Add a "use my location" button with all outcomes handled and a manual fallback.`,`Make two tabs elect a leader with Web Locks and share one WebSocket via BroadcastChannel.`],
teach:`<p>"Device APIs are favors: check they exist, ask politely at the right moment, accept 'no', and keep a plan B so the app works for everybody."</p>`}
],quiz:[
{code:`const c = document.createElement('canvas'); c.width = 2; c.height = 2;
const x = c.getContext('2d'); x.fillStyle = 'rgb(10,20,30)'; x.fillRect(0, 0, 1, 1);
console.log([...x.getImageData(0, 0, 1, 1).data], [...x.getImageData(1, 1, 1, 1).data]);`,ans:`[10, 20, 30, 255] [0, 0, 0, 0]`,why:`A painted pixel holds the color with full alpha (255); an unpainted pixel is transparent black.`},
{code:`const a = new BroadcastChannel('q'), b = new BroadcastChannel('q');
b.onmessage = (e) => { console.log('got', e.data); a.close(); b.close(); };
a.postMessage('hi'); console.log('sent');`,ans:`sent, then got hi`,why:`postMessage is asynchronous, so "sent" prints first. A channel doesn't receive its own messages, but other instances on the same name (such as other tabs) do.`}]},

{n:50,title:"Authentication and security II",goal:"Understand modern authentication flows and the hardening measures that protect real applications.",topics:[
{id:"d50-auth",title:"Authentication: sessions, JWT, OAuth/PKCE, passwords",lv:["senior","lead","architect"],
eli5:`<p><b>Authentication</b> is proving who you are (showing an ID); <b>authorization</b> is what you're allowed to do (the guest list). A <b>session</b> is a coat-check ticket: the club keeps your coat and you hold a numbered ticket. A <b>JWT</b> is a <b>sealed, signed letter</b> that says who you are; anyone can read it but nobody can change it without breaking the seal. <b>OAuth with PKCE</b> is logging in with an existing account (like "Sign in with Google") using a one-time secret handshake so nobody can steal the key mid-way. Passwords must be stored <b>scrambled with a slow blender</b>, never as the original.</p>`,
why:`<p>Authentication mistakes are a top cause of breaches. Interviews probe sessions vs tokens, JWT pitfalls, OAuth flows and password storage because the right answer depends on understanding the threat model, not memorizing a recipe.</p>`,
tech:`<table><tr><th></th><th>Server session (cookie)</th><th>JWT (signed token)</th></tr><tr><td>State</td><td>server stores session; cookie holds an opaque id</td><td>claims travel in the token; server can be stateless</td></tr><tr><td>Revocation</td><td>easy (delete the session)</td><td>hard before expiry (needs denylist/short lifetimes)</td></tr><tr><td>Storage</td><td>HttpOnly Secure SameSite cookie</td><td>cookie or memory; localStorage is readable by XSS</td></tr><tr><td>Best for</td><td>classic web apps, first-party sites</td><td>service-to-service, short-lived access tokens, distributed verification</td></tr></table>
<ul class="pts"><li><b>JWT anatomy:</b> <code>base64url(header).base64url(payload).signature</code>. The payload is <b>not encrypted</b>. <b>Verify:</b> pin the allowed algorithm (reject <code>alg: none</code> and algorithm confusion such as accepting an HS256 token signed with an RSA public key), check the signature, <code>exp</code>, <code>nbf</code>, <code>iss</code>, <code>aud</code>; keep lifetimes short (minutes) and rotate refresh tokens.</li><li><b>OAuth 2.0 / OIDC:</b> use the <b>authorization code flow with PKCE</b> for SPAs and mobile (the implicit flow is deprecated). The client creates a random <code>code_verifier</code>, sends <code>code_challenge = base64url(SHA-256(verifier))</code>, receives a code on redirect, and exchanges it with the verifier, so an intercepted code is useless. OIDC adds an ID token (who the user is); OAuth alone is about delegated access (scopes). Validate <code>state</code> (CSRF) and <code>nonce</code>.</li><li><b>Where to keep tokens in a SPA:</b> a Backend-for-Frontend holding tokens server-side behind an HttpOnly session cookie is the safest; otherwise short-lived access tokens in memory plus a refresh token in an HttpOnly cookie.</li><li><b>Passwords:</b> never store plaintext or fast hashes. Use a unique <b>salt</b> and a deliberately slow, memory-hard function: <b>Argon2id</b> (preferred), scrypt, bcrypt, or PBKDF2 (with ≥ 600,000 iterations for SHA-256). Compare in <b>constant time</b>. Prefer <b>passkeys/WebAuthn</b> and MFA (TOTP, security keys).</li><li><b>Also:</b> rate limiting and lockout, secure password reset (single-use, expiring tokens), session rotation after login (prevent fixation), logout invalidation, RBAC/ABAC on the <b>server</b> for every request.</li></ul>`,
diagram:{html:flow([["SPA creates verifier + challenge"],["redirect to login","code_challenge + state","w"],["user signs in at the identity provider","g"],["redirect back with code","w"],["POST code + verifier","provider checks SHA-256(verifier) = challenge","g"],["access (+ID) token","short-lived","g"]]),steps:["The random verifier never leaves the client until the final exchange; only its hash (challenge) goes through the browser redirect.","The provider authenticates the user and returns a one-time code bound to the challenge.","An attacker who steals the code can't redeem it without the verifier.","Tokens are short-lived; refresh tokens rotate."]},
ex:[{t:"PKCE, JWT verification and password hashing with Web Crypto (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).split("+").join("-").split("/").join("_").split("=").join("");
const fromB64u = (s) => { s = s.split("-").join("+").split("_").join("/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };
const hmacKey = (secret, usages) => crypto.subtle.importKey("raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, usages);
const sign = async (payload, secret) => {
  const h = b64u(enc.encode(JSON.stringify({ alg: "HS256", typ: "JWT" }))), p = b64u(enc.encode(JSON.stringify(payload)));
  return h + "." + p + "." + b64u(await crypto.subtle.sign("HMAC", await hmacKey(secret, ["sign"]), enc.encode(h + "." + p)));
};
const verify = async (token, secret, { now = () => Math.floor(Date.now() / 1000), aud } = {}) => {
  const [h, p, s = ""] = token.split(".");
  const header = JSON.parse(dec.decode(fromB64u(h)));

const rejects = async (f) => { try { await f(); return null; } catch (e) { return e.message; } };
const hashPw = async (pw, salt = crypto.getRandomValues(new Uint8Array(16)), iter = 1000) => {
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  return { salt: b64u(salt), iter, hash: b64u(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, key, 256)) };

const checkPw = async (pw, rec) => {

(async () => {

  check("alg=none tokens are rejected", (await rejects(() => verify(noneToken, "secret", { now: () => 1000 }))) === "alg not allowed");
  check("expired tokens are rejected", (await rejects(() => verify(token, "secret", { now: () => 3000 }))) === "expired");
  check("the wrong secret is rejected", (await rejects(() => verify(token, "other", { now: () => 1000 }))) === "bad signature");
  check("the wrong audience is rejected", (await rejects(() => verify(token, "secret", { now: () => 1000, aud: "other-app" }))) === "wrong audience");

  check("correct password verifies, wrong password does not", (await checkPw("correct horse", rec)) && !(await checkPw("wrong", rec)));

gotchas:[`JWT payloads are readable by anyone; never put secrets or sensitive PII in them.`,`Accepting the algorithm from the token header allows <code>alg: none</code> and key-confusion attacks; pin it server-side.`,`Long-lived JWTs can't be revoked; use short lifetimes plus refresh rotation or a server-side session.`,`Tokens in <code>localStorage</code> are stolen by any XSS; prefer HttpOnly cookies or a BFF.`,`Using a fast hash (SHA-256, MD5) for passwords makes cracking cheap; use Argon2id/scrypt/bcrypt/PBKDF2 with high cost.`,`OAuth without <code>state</code>/PKCE is vulnerable to CSRF and code interception; never use the implicit flow for new apps.`,`Don't confuse authentication (who you are) with authorization (what you may do); authorize on the server for every action.`],
best:[`Prefer well-reviewed libraries and managed identity providers over rolling your own; know the mechanics to evaluate them.`,`Use short-lived access tokens, rotated refresh tokens, HttpOnly Secure SameSite cookies and MFA/passkeys.`,`Rate-limit login and reset endpoints; log security events; rotate secrets and keys.`],
iq:[["senior","Sessions vs JWT: how do you choose?","Server sessions are simple and revocable for first-party web apps; JWTs suit distributed or service-to-service verification with short lifetimes. JWTs are hard to revoke and shouldn't be stored where XSS can read them."],["senior","How does PKCE protect the authorization code flow?","The client sends a hashed challenge up front and proves possession of the original verifier when redeeming the code, so an intercepted code is useless to an attacker."],["architect","How do you securely store passwords?","Unique salt per user and a slow memory-hard hash (Argon2id preferred; scrypt, bcrypt or PBKDF2 with a high iteration count), constant-time comparison, rate limiting, breach checks and MFA/passkeys."],["architect","Design auth for a SPA with a separate API.","Authorization code + PKCE with an identity provider (or a BFF that holds tokens server-side), short-lived access tokens, rotating refresh tokens in HttpOnly cookies, strict CORS, CSRF protection, scoped authorization on the API, token revocation and monitoring."]],
practice:[`Add refresh-token rotation (single-use refresh tokens with reuse detection) to a mock auth service.`,`Implement TOTP (RFC 6238) with HMAC-SHA1 and verify against the RFC test vectors.`],
teach:`<p>"Authentication is the ID check, authorization is the guest list. A session is a coat-check ticket; a JWT is a signed letter anyone can read but nobody can alter. OAuth with PKCE is a one-time handshake, and passwords are stored scrambled with salt in a deliberately slow function."</p>`},

{id:"d50-web-security-extra",title:"Security headers, SRI and supply chain",lv:["senior","lead","architect"],
eli5:`<p>After locking the door (authentication), put up more protections: <b>instructions to the browser</b> ("only run scripts from my own shop", "always use the secure door"), a <b>tamper-seal</b> on any package you borrow from others (<b>Subresource Integrity</b>), and a <b>checklist for everything you import</b> because one bad ingredient (a compromised library) can poison the whole meal.</p>`,
why:`<p>Most real attacks exploit configuration gaps and dependencies, not clever cryptography. Security headers are cheap, powerful defenses, and the npm supply chain is a major risk for every JavaScript project.</p>`,
tech:`<table><tr><th>Header</th><th>Purpose</th></tr><tr><td><code>Content-Security-Policy</code></td><td>restrict script/style/connect sources; nonces/hashes + <code>strict-dynamic</code>; <code>frame-ancestors</code>; Trusted Types (Day 20)</td></tr><tr><td><code>Strict-Transport-Security</code></td><td>force HTTPS (<code>max-age</code> ≥ 6 months, <code>includeSubDomains</code>, consider preload)</td></tr><tr><td><code>X-Content-Type-Options: nosniff</code></td><td>stop MIME sniffing</td></tr><tr><td><code>Referrer-Policy</code></td><td>limit URL leakage (<code>strict-origin-when-cross-origin</code>)</td></tr><tr><td><code>Permissions-Policy</code></td><td>disable powerful features you don't use (camera, geolocation...)</td></tr><tr><td><code>Cross-Origin-Opener-Policy / Embedder-Policy / Resource-Policy</code></td><td>process isolation, enabling <code>SharedArrayBuffer</code>, blocking cross-origin leaks</td></tr><tr><td><code>Set-Cookie</code> flags</td><td><code>HttpOnly; Secure; SameSite</code> (Day 20)</td></tr></table>
<ul class="pts"><li><b>Subresource Integrity (SRI):</b> <code>&lt;script src="https://cdn/x.js" integrity="sha384-..." crossorigin="anonymous"&gt;</code>; the browser refuses a file whose hash doesn't match, protecting against CDN compromise. Compute with <code>openssl dgst -sha384 -binary | base64</code>.</li><li><b>Supply chain:</b> commit lockfiles and use <code>npm ci</code>; review new dependencies (maintainers, downloads, install scripts); <code>npm audit</code>/Dependabot/Renovate; consider <code>--ignore-scripts</code> in CI; npm <b>provenance</b>; pin versions for critical packages; watch for typosquatting and dependency confusion (scope your private packages); minimize dependencies; generate an SBOM.</li><li><b>Secrets:</b> never ship secrets in client bundles (environment variables prefixed for the client, like <code>VITE_</code> or <code>NEXT_PUBLIC_</code>, are public); use a secrets manager; rotate on exposure; scan commits.</li><li><b>Other classics:</b> clickjacking (<code>frame-ancestors</code>), open redirects (Day 46), SSRF on servers (validate outbound URLs), rate limiting, input validation plus output encoding, prototype pollution (Day 7), verbose error leaks, subdomain takeover, CORS misconfiguration (Day 19).</li></ul>`,

ex:[{t:"Header auditor and SRI generator (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const REQUIRED = {
  "content-security-policy": "CSP limits where scripts load from",
  "strict-transport-security": "HSTS forces HTTPS",
  "x-content-type-options": "nosniff stops MIME sniffing",
  "referrer-policy": "limits referrer leakage",
  "permissions-policy": "restricts powerful features",
  "cross-origin-opener-policy": "isolates the browsing context group"
};
const auditHeaders = (headers) => {
  const h = Object.fromEntries(Object.entries(headers).map(([k, v]) => [k.toLowerCase(), String(v)]));
  const issues = Object.keys(REQUIRED).filter((k) => !(k in h)).map((k) => "missing " + k + ": " + REQUIRED[k]);
  if (h["content-security-policy"] && /unsafe-inline|unsafe-eval|[*]/.test(h["content-security-policy"])) issues.push("CSP allows unsafe-inline/unsafe-eval or wildcard sources");
  if (h["strict-transport-security"]) {
    const m = /max-age=([0-9]+)/.exec(h["strict-transport-security"]);
    if (!m) issues.push("HSTS missing max-age"); else if (Number(m[1]) < 15552000) issues.push("HSTS max-age under 180 days");
  }
  return issues;
};
const good = { "Content-Security-Policy": "default-src 'self'; script-src 'nonce-abc' 'strict-dynamic'; object-src 'none'", "Strict-Transport-Security": "max-age=31536000; includeSubDomains", "X-Content-Type-Options": "nosniff", "Referrer-Policy": "strict-origin-when-cross-origin", "Permissions-Policy": "geolocation=()", "Cross-Origin-Opener-Policy": "same-origin" };
check("a bare response misses all six headers", auditHeaders({}).length === 6);
check("a hardened response has no findings", auditHeaders(good).length === 0);
check("an unsafe CSP is flagged", auditHeaders({ ...good, "Content-Security-Policy": "script-src 'self' 'unsafe-inline'" }).some((i) => i.includes("unsafe")));
check("a wildcard CSP source is flagged", auditHeaders({ ...good, "Content-Security-Policy": "script-src *" }).some((i) => i.includes("wildcard")));
check("a short HSTS lifetime is flagged", auditHeaders({ ...good, "Strict-Transport-Security": "max-age=300" }).some((i) => i.includes("180 days")));
const sri = async (text) => "sha384-" + btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest("SHA-384", new TextEncoder().encode(text)))));
(async () => {
  const a = await sri("console.log('lib v1')"), b = await sri("console.log('lib v1 + malware')");
  check("SRI string has the sha384- prefix and a 64-character digest", a.startsWith("sha384-") && a.length === 7 + 64);
  check("the hash is stable for the same content", a === (await sri("console.log('lib v1')")));
  check("any change to the file changes the hash, so the browser would block it", a !== b);
})();`}],
gotchas:[`A CSP with <code>'unsafe-inline'</code> or wildcards gives little protection; start in report-only mode and tighten.`,`HSTS with <code>includeSubDomains</code>/preload is hard to undo; test first with a short max-age.`,`SRI requires CORS (<code>crossorigin</code>) and breaks if the CDN serves different bytes (for example automatic minification variants).`,`Environment variables with public prefixes are shipped to browsers; secrets there are leaked.`,`<code>npm install</code> runs install scripts of all dependencies; a compromised package can run code on developer and CI machines.`,`Caret ranges pull in new versions automatically; a lockfile and review process are the real defense.`],
best:[`Deploy a baseline header set via your server/CDN config and test it in CI; use securityheaders-style audits.`,`Pin third-party scripts with SRI or self-host them; minimize third-party code.`,`Treat dependency updates as code changes: review, test, and use automated alerts.`],
iq:[["senior","Which security headers would you add to a new site?","CSP (nonce-based), HSTS, X-Content-Type-Options nosniff, Referrer-Policy, Permissions-Policy, COOP/CORP as needed, plus HttpOnly/Secure/SameSite cookies and frame-ancestors for clickjacking."],["senior","What is Subresource Integrity?","A hash attribute on script/link tags that makes the browser reject a third-party file that doesn't match the expected digest, protecting against CDN tampering."],["architect","How do you reduce npm supply-chain risk?","Lockfiles and npm ci, minimal dependencies, review of new/changed packages and install scripts, automated audits and update bots, provenance, scoped private registries, CI without unnecessary secrets, and an SBOM."]],
