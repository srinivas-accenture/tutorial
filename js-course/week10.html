window.GLOSSARY=[
["Call stack","The structure that tracks which function is running and where to return. One stack per thread."],
["Closure","A function plus a live reference to the variables of the scope where it was created."],
["Coercion","Automatic or explicit conversion of a value from one type to another."],
["Event loop","The mechanism that takes tasks from queues and runs them one at a time on the call stack, draining microtasks between tasks."],
["Hoisting","Declarations are registered when a scope is created, before any line of that scope runs."],
["Hidden class (Map/shape)","V8's internal description of an object's property layout, shared by objects built the same way."],
["Inline cache","A per-call-site cache of the shapes seen, used to make property access fast."],
["Microtask","A small job (promise reaction, queueMicrotask) that runs as soon as the stack is empty, before the next task."],
["Prototype","The object another object delegates to when a property is not found on itself."],
["Reflow (layout)","Recomputing sizes and positions of elements."],
["Repaint","Redrawing pixels without recomputing layout."],
["Temporal dead zone","The span between entering a scope and the line that initializes a let, const or class binding. Access throws."],
["Tree-shaking","Removing unused exports from a bundle using static import/export analysis."],
["Hydration","Attaching JavaScript behavior to server-rendered HTML."],
["Backpressure","A consumer signalling a producer to slow down so memory does not grow without bound."],
["Origin","Scheme + host + port. The unit of the same-origin policy."],
["Preflight","An OPTIONS request the browser sends before a non-simple cross-origin request."],
["Structured clone","The browser algorithm for deep-copying values for postMessage, structuredClone and IndexedDB."],
["TDZ, ASI, IIFE","Temporal dead zone; automatic semicolon insertion; immediately invoked function expression."],
["ADR","Architecture Decision Record: a short document capturing a decision, its context, options and consequences."],
["CRDT","Conflict-free replicated data type: data that merges in any order and still converges."],
["Idempotent","An operation that can be repeated safely with the same final effect."],
["Hydration mismatch","Server and client render different HTML for the same component, causing errors or flicker."],
["PKCE","Proof Key for Code Exchange: a one-time secret that protects the OAuth authorization-code flow for public clients."],
["Idempotency key","A client-supplied id that makes a retried request safe to repeat."],
["Typed array","A fixed-type view over an ArrayBuffer (Uint8Array, Float32Array...) for binary data."],
["AST","Abstract syntax tree: the structured representation of source code that compilers and linters analyze."],
["INP","Interaction to Next Paint. The Core Web Vital for responsiveness. Good is 200 ms or less."]

<script>
window.WEEK={w:10,revision:[
"<b>Routing:</b> <code>history.pushState/replaceState</code> change the URL without reload; <code>popstate</code> fires on back/forward (not on pushState). History routing needs a server fallback to <code>index.html</code>; hash routing doesn't. Intercept only same-origin, unmodified left-clicks; update the title and move focus on route change.",
"<b>URLs:</b> <code>URL</code> and <code>URLSearchParams</code> parse and build; <code>encodeURIComponent</code> encodes components, <code>encodeURI</code> whole URLs; keep UI state (filters, page) in the query string; validate redirect targets (same-origin only) to prevent open redirects.",
"<b>Forms:</b> use native validation attributes and the Constraint Validation API (<code>validity</code>, <code>setCustomValidity</code>, <code>checkValidity</code>); <code>FormData</code> skips unchecked boxes; client validation is UX, the server must re-validate; connect errors with <code>aria-describedby</code>/<code>aria-invalid</code>.",
"<b>Files:</b> <code>File</code> extends <code>Blob</code>; slice for chunked/resumable uploads; free object URLs; MIME type and extension can lie, so the server verifies; XHR gives upload progress, fetch streams are limited.",
"<b>Accessibility:</b> POUR (perceivable, operable, understandable, robust); semantic HTML first; contrast 4.5:1 (3:1 large text); visible focus; manage focus on dynamic changes; <code>aria-live</code> for announcements; test with keyboard and a screen reader.",
"<b>Web Components:</b> custom elements (lifecycle + attributes/properties), Shadow DOM (style encapsulation, slots, <code>::part</code>, composed events), templates; no framework required, accessibility and SSR need care.",
"<b>Canvas</b> = pixels (fast, no DOM per shape), <b>SVG</b> = DOM shapes (accessible, scalable). Animate with <code>requestAnimationFrame</code> and a fixed timestep; scale for <code>devicePixelRatio</code>.",
"<b>Device APIs:</b> feature-detect, ask for permission in context after a user gesture, handle denial gracefully; <code>BroadcastChannel</code> and Web Locks coordinate tabs.",
"<b>Auth:</b> sessions (server state, cookie) vs JWT (signed claims; verify algorithm, signature, exp, aud); OAuth 2 authorization code + <b>PKCE</b> for SPAs; hash passwords with salt and a slow function (Argon2id/scrypt/bcrypt/PBKDF2).",
"<b>Hardening:</b> security headers (CSP, HSTS, nosniff, Referrer-Policy, Permissions-Policy, COOP), Subresource Integrity for third-party scripts, lockfiles and audits for the supply chain."
],days:[
{n:46,title:"Routing and URLs",goal:"Understand how single-page apps navigate, keep state in the URL, and handle URLs safely.",topics:[
{id:"d46-history-routing",title:"Client-side routing and the History API",lv:["mid","senior"],
eli5:`<p>A single-page app is like a <b>book with a magic bookmark strip</b>. Turning to a new "page" doesn't fetch a new book; the app swaps what's on the page and updates the address bar so that the back button, bookmarks and shared links still work. The <b>History API</b> is how you write on the bookmark strip yourself.</p>`,
why:`<p>Without routing, a single-page app has one URL and no back button. The History API lets JavaScript change the URL and keep session history without a full page load, which is what every SPA router (React Router, Vue Router, Angular Router) is built on.</p>`,
tech:`<ul class="pts"><li><b><code>history.pushState(state, "", url)</code></b> adds an entry and changes the URL (same origin only) without loading anything. <b><code>replaceState</code></b> edits the current entry. Neither fires an event.</li><li><b><code>popstate</code></b> fires on the window when the user navigates back/forward (and on <code>history.back()/go()</code>), giving you the saved <code>event.state</code>; you re-render for the new URL.</li><li><b>Two routing modes:</b> <b>history mode</b> (clean URLs <code>/users/42</code>) needs the server to return <code>index.html</code> for unknown paths (and real 404s for API/asset misses); <b>hash mode</b> (<code>/#/users/42</code>) needs no server config and works on static hosts.</li><li><b>Link interception:</b> on click, ignore if <code>defaultPrevented</code>, non-left button, modifier keys (Ctrl/Cmd/Shift/Alt), <code>target="_blank"</code>, <code>download</code>, cross-origin; otherwise <code>preventDefault()</code> and <code>navigate(href)</code>.</li><li><b>On every route change:</b> update <code>document.title</code>, move focus to the new main heading (or announce in a live region), restore or reset scroll (<code>history.scrollRestoration</code>), and cancel in-flight requests.</li><li><b>Router features:</b> path params (<code>/users/:id</code>), query params, nested routes, guards (auth redirect), lazy-loaded route chunks (Day 24), 404 route.</li><li><b>Navigation API</b> (<code>navigation.navigate</code>, the <code>navigate</code> event) is a newer, cleaner model in Chromium; check current support before depending on it.</li></ul>`,
diagram:{html:flow([["click link"],["intercept","preventDefault + pushState(url)","w"],["render route","match path → component","g"],["user presses Back","popstate event","w"],["render previous route","from location.pathname","g"]]),steps:["The router listens for clicks on same-origin links and stops the browser's full navigation.","<code>pushState</code> changes the address bar and history stack instantly.","The router matches the path to a route and renders it.","Back/forward fire <code>popstate</code>; the router reads the URL and renders the matching route again."]},
ex:[{t:"A small router with params, query, history stack and guards (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const compile = (pattern) => {
  const keys = [];
  const re = new RegExp("^" + pattern.replace(/:([A-Za-z_]+)/g, (_, k) => { keys.push(k); return "([^/]+)"; }) + "/?$");
  return (path) => { const m = re.exec(path); return m ? Object.fromEntries(keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) : null; };
};
function createRouter(routes){
  const compiled = routes.map((r) => ({ ...r, match: compile(r.path) }));
  let stack = [], i = -1, current = null;
  const guards = [], listeners = new Set();
  const resolve = (path) => {
    const [p, qs = ""] = path.split("?");
    for (const r of compiled) { const params = r.match(p); if (params) return { name: r.name, params, query: Object.fromEntries(new URLSearchParams(qs)), path }; }
    return { name: "not-found", params: {}, query: {}, path };
  };
  const show = (path) => { current = resolve(path); listeners.forEach((f) => f(current)); };
  function navigate(path, { replace = false } = {}){
    const next = resolve(path);
    for (const g of guards) { const r = g(next, current); if (r === false) return false; if (typeof r === "string") return navigate(r, { replace }); }
    if (replace && i >= 0) stack[i] = path; else { stack = stack.slice(0, i + 1); stack.push(path); i++; }
    show(path); return true;
  }
  return {
    navigate, beforeEach: (g) => guards.push(g), subscribe: (f) => (listeners.add(f), () => listeners.delete(f)),
    back(){ if (i > 0) { i--; show(stack[i]); } }, forward(){ if (i < stack.length - 1) { i++; show(stack[i]); } },
    get current(){ return current; }, get stack(){ return [...stack]; }
  };
}
const state = { loggedIn: false };
const r = createRouter([{ path: "/", name: "home" }, { path: "/users/:id", name: "user" }, { path: "/search", name: "search" }, { path: "/admin", name: "admin" }, { path: "/login", name: "login" }]);
r.beforeEach((to) => (to.name === "admin" && !state.loggedIn ? "/login" : true));
const seen = []; r.subscribe((c) => seen.push(c.name));
r.navigate("/", { replace: true });
r.navigate("/users/42?tab=posts");
check("path params and query are parsed", r.current.name === "user" && r.current.params.id === "42" && r.current.query.tab === "posts");
r.navigate("/search?q=js%20router");
check("query strings are decoded", r.current.query.q === "js router");
r.back();
check("back returns to the previous route", r.current.name === "user");
r.navigate("/users/7");
check("navigating after back drops the forward entries", r.stack.join() === "/,/users/42?tab=posts,/users/7");
r.forward();
check("forward does nothing when there is no forward entry", r.current.params.id === "7");
r.navigate("/users/8", { replace: true });
check("replace edits the current entry instead of adding one", r.stack.length === 3 && r.stack[2] === "/users/8");
r.navigate("/nope/at/all");
check("unknown paths resolve to not-found", r.current.name === "not-found");
r.navigate("/admin");
check("guard redirects unauthenticated users to /login", r.current.name === "login");
state.loggedIn = true; r.navigate("/admin");
check("guard allows authenticated users", r.current.name === "admin");
check("a route with an encoded param decodes it", compile("/tags/:t")("/tags/c%2B%2B").t === "c++");
check("subscribers are notified on every change", seen.length >= 8 && seen[0] === "home");`},
{t:"The real browser API (reference)",code:`// Navigate without a page load
function navigate(url){
  history.pushState({ scrollY: 0 }, "", url);
  render(location.pathname + location.search);
  document.title = titleFor(location.pathname);
  document.querySelector("h1")?.focus();               // a11y: move focus to the new page heading (tabindex="-1")
}
// Back / forward
window.addEventListener("popstate", () => render(location.pathname + location.search));

// Intercept links (event delegation, Day 17)
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href]");
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  if (a.target === "_blank" || a.hasAttribute("download")) return;
  const url = new URL(a.href);
  if (url.origin !== location.origin) return;           // let the browser handle external links
  e.preventDefault();
  navigate(url.pathname + url.search + url.hash);
});
// Server: for any non-file, non-API path, respond with index.html (history mode)`,run:false}],

{id:"d46-url-patterns",title:"URLs, query state and safe redirects",lv:["fresher","mid","senior"],
eli5:`<p>A URL is a <b>postal address</b> with parts: country (scheme), city (host), street (path), flat number (query) and a note on the door (fragment). The <code>URL</code> tool reads and writes those parts correctly, so you never have to chop strings by hand. And if a website says "after login, send me to <i>this</i> address", you must check that address is still in <b>your own town</b>, or crooks will send people to a fake site.</p>`,
why:`<p>Hand-parsing URLs causes bugs (double encoding, missing separators) and security holes (open redirects). Keeping UI state like filters and pagination in the URL makes pages shareable, bookmarkable and restorable.</p>`,
tech:`<ul class="pts"><li><b>Parts:</b> <code>protocol</code>, <code>host</code> (hostname + port), <code>origin</code>, <code>pathname</code>, <code>search</code>, <code>hash</code>. <code>new URL(relative, base)</code> resolves relative URLs (<code>"../c"</code>); <code>URL.canParse()</code> validates.</li><li><b><code>URLSearchParams</code></b>: <code>get</code>, <code>getAll</code>, <code>set</code>, <code>append</code>, <code>delete</code>, iteration; <code>+</code> decodes to a space in query strings; repeated keys (<code>a=1&amp;a=2</code>) need <code>getAll</code>.</li><li><b>Encoding:</b> <code>encodeURIComponent</code> for a single value (encodes <code>&amp; = / ? #</code>); <code>encodeURI</code> for a full URL (leaves those). Never build query strings by concatenation.</li><li><b>URL as state:</b> put filters, sort, page, selected tab in the query string; read on load, write with <code>replaceState</code> while typing and <code>pushState</code> for discrete steps.</li><li><b>URLPattern</b> (<code>new URLPattern({ pathname: "/users/:id" })</code>) matches URLs declaratively (check support; routers use it increasingly).</li><li><b>Open redirects:</b> a <code>?next=</code> parameter that is followed blindly lets attackers craft links on your domain that bounce victims to phishing sites. Allow only same-origin relative paths, reject <code>//host</code>, schemes and backslash tricks, or use an allowlist/ID instead of a URL.</li></ul>`,
diagram:{html:flow([["login?next=//evil.com"],["new URL(next, origin)","parse + resolve","w"],["same origin?","no → fall back to /","r"],["yes → redirect to path","g"]]),steps:["Never redirect to a raw user-supplied string.","Resolve it against your own origin so relative and tricky forms are normalized.","If the resolved origin differs from yours, ignore the target and use a safe default.","Prefer opaque identifiers (a named destination) over full URLs when possible."]},
ex:[{t:"URL parsing, encoding, query state and a safe redirect (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const u = new URL("https://user@example.com:8080/a/b?x=1&x=2&y=%20z+w#frag");
check("parts", u.protocol === "https:" && u.hostname === "example.com" && u.port === "8080" && u.origin === "https://example.com:8080" && u.pathname === "/a/b" && u.hash === "#frag");
check("repeated keys and + decoding", u.searchParams.getAll("x").join() === "1,2" && u.searchParams.get("y") === " z w");
check("relative resolution", new URL("../c?q=1#h", "https://a.com/b/d/e").href === "https://a.com/b/c?q=1#h");
check("encodeURIComponent vs encodeURI", encodeURIComponent("a b&c=d/e") === "a%20b%26c%3Dd%2Fe" && encodeURI("a b&c=d/e") === "a%20b&c=d/e");
const q = new URLSearchParams(); q.set("name", "Ana & Bob"); q.append("tag", "js"); q.append("tag", "web");
check("URLSearchParams encodes safely", q.toString() === "name=Ana+%26+Bob&tag=js&tag=web");
const setQuery = (href, patch) => { const x = new URL(href); for (const [k, v] of Object.entries(patch)) { if (v == null || v === "") x.searchParams.delete(k); else x.searchParams.set(k, v); } return x.pathname + x.search + x.hash; };
check("URL as UI state: set, update and remove params", setQuery("https://x.com/list?page=2&q=a", { page: 1, q: "" }) === "/list?page=1" && setQuery("https://x.com/list?page=2", { sort: "asc" }) === "/list?page=2&sort=asc");
const safeNext = (next, base = "https://app.example.com") => {
  try {
    const target = new URL(next, base);
    const ok = target.origin === new URL(base).origin && !next.startsWith("//") && !next.includes("\\\\");
    return ok ? target.pathname + target.search + target.hash : "/";
  } catch { return "/"; }
};
check("safe same-origin paths are allowed", safeNext("/dashboard?tab=1") === "/dashboard?tab=1" && safeNext("https://app.example.com/ok") === "/ok");
check("protocol-relative URLs are rejected", safeNext("//evil.com/phish") === "/");
check("other origins are rejected", safeNext("https://evil.com/x") === "/");
check("backslash tricks are rejected", safeNext("/\\\\evil.com") === "/");
check("javascript: URLs are rejected", safeNext("javascript:alert(1)") === "/");
if (typeof URLPattern === "function") {
  const m = new URLPattern({ pathname: "/users/:id" }).exec("https://x.com/users/7");
  check("URLPattern matches declaratively", m.pathname.groups.id === "7");
} else console.log("skip  URLPattern is not available in this browser");`}],
gotchas:[`<code>encodeURI</code> doesn't encode <code>&amp;</code>, <code>=</code>, <code>?</code>, <code>#</code>, so it is wrong for individual values.`,`<code>searchParams.get</code> returns only the first of repeated keys; use <code>getAll</code>.`,`<code>location.hash</code> isn't sent to the server; don't rely on it for server-side logic.`,`Checking a redirect with <code>startsWith("/")</code> alone accepts <code>//evil.com</code>.`,`<code>URL</code> throws on invalid input (use try/catch or <code>URL.canParse</code>).`,`Trailing-slash and case differences create duplicate URLs for SEO and caching; canonicalize.`],
best:[`Always use <code>URL</code>/<code>URLSearchParams</code> to build and parse; never string-concatenate query strings.`,`Keep shareable state in the URL; validate every redirect target on the server and the client.`,`Canonicalize URLs (lowercase host, consistent trailing slash) and add <code>rel="canonical"</code> where needed.`],
iq:[["fresher","What is the difference between encodeURI and encodeURIComponent?","encodeURIComponent encodes everything that has meaning in a URL (& = ? / #) and is for single values; encodeURI leaves those so it can be used on a whole URL."],["mid","How do you read and update query parameters?","Use new URL(location.href).searchParams: get/getAll/set/append/delete, then history.replaceState or pushState with the new search string."],["senior","What is an open redirect and how do you prevent it?","A redirect to an attacker-controlled URL via a user-supplied parameter. Only allow same-origin relative paths (resolve with new URL against your origin, reject //host, backslashes and other schemes) or use an allowlist/IDs."]],
practice:[`Build a filter UI whose state lives entirely in the URL and survives refresh and back/forward.`,`Write tests for <code>safeNext</code> with 15 tricky inputs (encoded slashes, tabs, unicode dots).`],
teach:`<p>"A URL is an address with parts; the URL tool reads and writes them correctly. Keep filters and pages in the query string so links are shareable, and never redirect to an address you haven't checked is still on your own site."</p>`}

const u = new URL('https://x.com?a=1&a=2&b=%20x+y');
console.log(u.searchParams.getAll('a'), u.searchParams.get('b'), encodeURIComponent('a b&c'), encodeURI('a b&c'));`,ans:`https://a.com/b/c?x=1#h, then ["1", "2"] " x y" a%20b%26c a%20b&c`,why:`".." removes the last directory of the base path. getAll returns every repeated key, "+" decodes to a space in queries, and encodeURI leaves "&" alone while encodeURIComponent encodes it.`},
{code:`const safe = (next, base = 'https://app.com') => { try { const t = new URL(next, base); return t.origin === base && !next.startsWith('//') ? t.pathname : '/'; } catch { return '/'; } };
console.log(safe('/ok'), safe('//evil.com'), safe('https://evil.com'));`,ans:`/ok / /`,why:`Resolving against your own origin and comparing origins blocks absolute foreign URLs; the explicit //-check blocks protocol-relative ones (which new URL would otherwise resolve to the foreign host).`}]},

{n:47,title:"Forms and files",goal:"Build forms with native validation correctly and handle files, uploads, drag and drop and the clipboard.",topics:[
{id:"d47-forms-validation",title:"Forms and the Constraint Validation API",lv:["fresher","mid","senior"],
eli5:`<p>A form is a <b>paper form at a counter</b>. The browser is a helpful clerk who checks it before you hand it in: "you forgot your email", "age must be 18 or more". The <b>Constraint Validation API</b> lets your code ask the clerk what's wrong and write custom notes. But the real counter (the server) must check again, because anyone can hand over a forged form.</p>`,
why:`<p>Forms are the main way users send data. Native validation gives free, accessible checks; understanding <code>FormData</code>, validity states and submit handling avoids reinventing (and breaking) browser behavior.</p>`,
tech:`<ul class="pts"><li><b>Native constraints:</b> <code>required</code>, <code>type</code> (<code>email</code>, <code>url</code>, <code>number</code>, <code>date</code>), <code>min/max</code>, <code>minlength/maxlength</code>, <code>pattern</code>, <code>step</code>. Prefer the right <code>type</code>, <code>inputmode</code> and <code>autocomplete</code> tokens (<code>email</code>, <code>one-time-code</code>, <code>new-password</code>).</li><li><b>API:</b> <code>input.validity</code> (<code>valueMissing, typeMismatch, patternMismatch, rangeUnderflow/Overflow, tooShort/tooLong, stepMismatch, badInput, customError, valid</code>), <code>checkValidity()</code>, <code>reportValidity()</code>, <code>setCustomValidity(msg)</code> (empty string clears), <code>validationMessage</code>, form attribute <code>novalidate</code> to take over the UI.</li><li><b><code>FormData</code>:</b> built from a form; <b>unchecked checkboxes/radios, disabled controls and unnamed fields are skipped</b>; repeated names produce multiple entries (<code>getAll</code>); file inputs add <code>File</code> objects. <code>Object.fromEntries(fd)</code> loses repeated keys.</li><li><b>Submit handling:</b> listen to <code>submit</code> (not button click) so Enter-key and <code>requestSubmit()</code> work; <code>event.preventDefault()</code>; use <code>event.submitter</code> to know which button; prevent double submit (disable after validation, idempotency keys).</li><li><b>Events:</b> <code>input</code> fires on every change, <code>change</code> on commit/blur; validate on blur and after first submit attempt, not on every keystroke for untouched fields.</li><li><b>Accessible errors:</b> real <code>&lt;label for&gt;</code>, error text linked with <code>aria-describedby</code>, <code>aria-invalid="true"</code>, a summary with focus on the first error, and an <code>aria-live</code>/<code>role="alert"</code> region. Don't rely on color or placeholders alone.</li><li><b>Security:</b> client validation is a convenience; the server must validate and sanitize everything, and protect against CSRF (Day 20).</li></ul>`,
diagram:{html:flow([["user submits"],["browser validates","native constraints","w"],["invalid? show errors + focus first","g"],["valid → submit event","preventDefault, FormData","w"],["fetch POST","server re-validates!","r"]]),steps:["The browser checks constraints before firing the submit event (unless <code>novalidate</code>).","On failure it shows messages and focuses the first invalid control.","On success your submit handler reads <code>FormData</code> and sends it.","The server must validate again; the client check can be bypassed."]},
ex:[{t:"Constraint validation and FormData on a detached form (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const doc = document.implementation.createHTMLDocument("");
const form = doc.createElement("form");
form.innerHTML = '<input name="email" type="email" required><input name="age" type="number" min="18" max="99"><input name="code" pattern="[A-Z]{3}[0-9]{2}"><input name="note"><input type="checkbox" name="tos" value="yes"><input type="checkbox" name="news" value="on" checked><select name="color"><option value="r">red</option><option value="g" selected>green</option></select>';
const f = (n) => form.elements[n];
check("required empty field: valueMissing", f("email").validity.valueMissing && !f("email").checkValidity());
f("email").value = "abc";
check("wrong format: typeMismatch", f("email").validity.typeMismatch && !f("email").validity.valueMissing);
f("email").value = "a@b.co";
check("valid email", f("email").checkValidity());
f("age").value = "17"; check("below min: rangeUnderflow", f("age").validity.rangeUnderflow);
f("age").value = "120"; check("above max: rangeOverflow", f("age").validity.rangeOverflow);
f("age").value = "30"; check("in range", f("age").checkValidity());
f("code").value = "abc12"; check("pattern mismatch", f("code").validity.patternMismatch);
f("code").value = "ABC12"; check("pattern ok", f("code").checkValidity());
f("code").setCustomValidity("Code already used");
check("custom (server) error blocks validity and carries a message", f("code").validity.customError && !f("code").checkValidity() && f("code").validationMessage === "Code already used" && !form.checkValidity());
f("code").setCustomValidity("");

const fd = new FormData(form);
check("FormData skips unchecked boxes and keeps order", [...fd.keys()].join() === "email,age,code,note,news,color");
check("empty text inputs are included as empty strings; select gives its value", fd.get("note") === "" && fd.get("color") === "g" && fd.get("news") === "on");
const multi = doc.createElement("form");
multi.innerHTML = '<input type="checkbox" name="tag" value="a" checked><input type="checkbox" name="tag" value="b" checked>';
const mfd = new FormData(multi);
check("repeated names: Object.fromEntries loses values, getAll keeps them", Object.fromEntries(mfd).tag === "b" && mfd.getAll("tag").join() === "a,b");
const toObject = (formData) => { const o = {}; for (const [k, v] of formData) { if (k in o) o[k] = [].concat(o[k], v); else o[k] = v; } return o; };
check("a safe FormData-to-object helper", JSON.stringify(toObject(mfd)) === '{"tag":["a","b"]}');`},
{t:"Accessible error pattern and submit handler (reference)",code:`<form id="signup" novalidate>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email"
         aria-describedby="email-err" aria-invalid="false">
  <p id="email-err" class="error" role="alert"></p>
  <button>Create account</button>
</form>
<script>
const form = document.getElementById("signup");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const invalid = [...form.elements].filter((el) => el.willValidate && !el.checkValidity());
  for (const el of form.elements) {
    if (!el.willValidate) continue;
    const msg = document.getElementById(el.id + "-err");
    el.setAttribute("aria-invalid", String(!el.checkValidity()));
    if (msg) msg.textContent = el.checkValidity() ? "" : el.validationMessage;
  }
  if (invalid.length) { invalid[0].focus(); return; }          // focus the first error
  const data = Object.fromEntries(new FormData(form));
  const res = await fetch("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  if (res.status === 422) { /* map server errors to setCustomValidity + re-render messages */ }
});
<\/script>`,run:false}],
gotchas:[`Unchecked checkboxes, disabled fields and unnamed inputs are not in <code>FormData</code>.`,`<code>type="number"</code> accepts <code>e</code> and returns an empty value for invalid text; use <code>inputmode="numeric"</code> with a pattern for codes, ZIPs and credit-card style fields.`,`<code>setCustomValidity</code> stays until you clear it with an empty string; forgetting this makes a field permanently invalid.`,`Listening to the submit button's click misses Enter-key submission and <code>requestSubmit()</code>.`,`<code>maxlength</code>/<code>tooLong</code> only trigger for user edits, not programmatic changes.`,`Disabling the submit button without a loading state or double-submit protection confuses users and doesn't stop replayed requests.`,`Browser-specific validation bubbles are poorly styled and not announced consistently; custom UI must replicate the accessibility.`],

iq:[["fresher","How do you validate a form in plain JavaScript/HTML?","Use native constraint attributes (required, type, pattern, min/max) and the Constraint Validation API (checkValidity, validity, setCustomValidity); always re-validate on the server."],["mid","What does FormData include and exclude?","Named, enabled controls with values; unchecked checkboxes/radios, disabled fields and unnamed fields are excluded; repeated names produce multiple entries."],["senior","How do you make form errors accessible?","Label every control, link error text with aria-describedby, set aria-invalid, announce via role=alert or a live region, move focus to the first error or a summary, and don't depend on color alone."],["senior","How would you handle a server-side validation error for a field?","Map the response to the field, call setCustomValidity (or render the error and aria-invalid), focus the field, and clear the custom validity when the user edits it."]],

teach:`<p>"The browser is a clerk that checks the form before it's handed in, and you can ask it what's wrong or add your own notes. FormData skips unchecked boxes. The server must check again, and error messages need labels and focus for everyone to use them."</p>`},

{id:"d47-files-clipboard-dnd",title:"Files, uploads, drag and drop, clipboard",lv:["mid","senior"],
eli5:`<p>A <b>file</b> in the browser is a sealed parcel: you can see its label (name, size, type) and open it only if you ask. To send a big parcel over a shaky road, you <b>cut it into pieces</b>, number them, and send them one by one so a break doesn't force a restart. <b>Drag and drop</b> is carrying a parcel to a doormat; the <b>clipboard</b> is the shared pocket between apps.</p>`,
why:`<p>Uploads, image previews, drag-and-drop and copy/paste are common product features with sharp edges: memory, security, progress, resumability and permissions.</p>`,
tech:`<ul class="pts"><li><b>Selecting:</b> <code>&lt;input type="file" accept="image/*" multiple&gt;</code>; <code>input.files</code> is a <code>FileList</code> of <code>File</code> objects (<code>name, size, type, lastModified</code>). <code>File</code> extends <code>Blob</code>.</li><li><b>Reading:</b> <code>await file.text()</code>, <code>arrayBuffer()</code>, <code>stream()</code> (prefer these over legacy <code>FileReader</code>); previews with <code>URL.createObjectURL(file)</code> (call <code>revokeObjectURL</code> when done) or <code>createImageBitmap</code>.</li><li><b>Uploading:</b> <code>fetch(url, { method: "POST", body: formData })</code> (don't set <code>Content-Type</code> manually; the browser adds the multipart boundary). <b>Progress</b>: <code>XMLHttpRequest.upload.onprogress</code> (fetch has no upload progress except experimental streaming request bodies). Use <code>AbortController</code> to cancel.</li><li><b>Large files:</b> <b>chunked/resumable uploads</b>: <code>file.slice(start, end)</code> chunks with offset + checksum, the server tracks received ranges and the client resumes from the last confirmed offset (tus protocol, S3 multipart, pre-signed URLs).</li><li><b>Validation:</b> check size and type on the client for UX, but the <b>MIME type and extension come from the user's system and can be spoofed</b>: the server must validate content (magic bytes), limit size, scan, rename and store outside the web root.</li><li><b>Drag and drop:</b> on the drop zone call <code>preventDefault()</code> in <code>dragenter</code> and <code>dragover</code> (or the drop won't fire), then read <code>event.dataTransfer.files</code> in <code>drop</code>; make it keyboard-accessible with a real file input fallback.</li><li><b>Clipboard API:</b> async <code>navigator.clipboard.writeText/readText</code> and <code>write/read</code> with <code>ClipboardItem</code>; requires a <b>secure context</b>, a <b>user gesture</b> and often a permission for reading; the <code>paste</code> event gives <code>clipboardData</code> without a prompt.</li></ul>`,
diagram:{html:flow([["file (11 bytes)"],["slice into chunks","4 + 4 + 3","w"],["upload chunk 1, 2, 3","each with offset + checksum","g"],["connection drops after chunk 2","r"],["resume from offset 8","only chunk 3 again","g"]]),steps:["The file is cut into fixed-size pieces with <code>slice</code>.","Each piece is sent with its offset and a checksum so the server can verify and reassemble.","If the network fails, the client asks the server for the last confirmed offset.","Only the missing pieces are re-sent, so large uploads survive unreliable connections."]},
ex:[{t:"File and Blob, chunking, checksum and validation (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
const sha256 = async (blob) => hex(await crypto.subtle.digest("SHA-256", await blob.arrayBuffer()));
const chunks = (blob, size) => Array.from({ length: Math.ceil(blob.size / size) }, (_, i) => blob.slice(i * size, (i + 1) * size));
const validateFile = (file, { types, maxBytes }) => {
  const errors = [];
  if (!types.includes(file.type)) errors.push("type not allowed");
  if (file.size > maxBytes) errors.push("file too large");
  if (file.size === 0) errors.push("file is empty");
  return errors;
};
(async () => {
  const file = new File(["hello world"], "greeting.txt", { type: "text/plain" });
  check("File extends Blob and exposes metadata", file instanceof Blob && file.name === "greeting.txt" && file.size === 11 && file.type === "text/plain");
  check("text() reads the content", (await file.text()) === "hello world");
  const parts = chunks(file, 4);
  check("chunk sizes for an 11-byte file with size 4", parts.map((p) => p.size).join() === "4,4,3");
  check("chunks reassemble to the identical file (checksums match)", (await sha256(new Blob(parts))) === (await sha256(file)));
  check("SHA-256 test vector for 'hello'", (await sha256(new Blob(["hello"]))) === "2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824");
  let resumeFrom = 8;                                                     // server confirmed 8 bytes
  const remaining = file.slice(resumeFrom);
  check("resuming uploads only the unsent remainder", remaining.size === 3 && (await remaining.text()) === "rld");
  const url = URL.createObjectURL(file);
  check("object URLs point at the Blob and must be revoked", url.startsWith("blob:")); URL.revokeObjectURL(url);
  const reader = file.stream().getReader(); let bytes = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; bytes += value.length; }
  check("stream() reads the file incrementally", bytes === 11);
  const rules = { types: ["image/png", "image/jpeg"], maxBytes: 5 };
  check("validation catches type and size", validateFile(file, rules).join() === "type not allowed,file too large");
  check("a valid file passes", validateFile(new File(["abc"], "a.png", { type: "image/png" }), rules).length === 0);
  check("an empty file is flagged", validateFile(new File([], "e.png", { type: "image/png" }), rules).includes("file is empty"));
  const spoofed = new File(["<script>alert(1)<\\/script>"], "evil.png", { type: "image/png" });
  check("the declared type can lie: the server must inspect the bytes", spoofed.type === "image/png" && (await spoofed.text()).startsWith("<script>"));
})();`},
{t:"Drag and drop, XHR progress and clipboard (reference)",code:`// Drop zone: preventDefault on dragenter AND dragover, or drop never fires
const zone = document.querySelector("#drop");
["dragenter", "dragover"].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.add("hot"); }));
zone.addEventListener("dragleave", () => zone.classList.remove("hot"));
zone.addEventListener("drop", (e) => {
  e.preventDefault(); zone.classList.remove("hot");
  upload([...e.dataTransfer.files]);                        // also provide <input type="file"> for keyboard users
});

// Upload with progress (fetch has no upload progress; XHR does)
function upload(files){
  const fd = new FormData(); files.forEach((f) => fd.append("files", f));
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload");
  xhr.upload.onprogress = (e) => e.lengthComputable && (bar.value = e.loaded / e.total);
  xhr.onload = () => console.log("done", xhr.status);
  xhr.send(fd);                                             // do NOT set Content-Type; the browser adds the boundary
}

// Clipboard (secure context + user gesture)
copyBtn.addEventListener("click", async () => { await navigator.clipboard.writeText(shareUrl); toast("Copied"); });
document.addEventListener("paste", (e) => { const file = e.clipboardData.files[0]; if (file) preview(file); });`,run:false}],
gotchas:[`Setting <code>Content-Type: multipart/form-data</code> yourself breaks the upload (missing boundary).`,`Forgetting <code>preventDefault()</code> on <code>dragover</code> makes the drop event never fire.`,`Reading a huge file with <code>arrayBuffer()</code> or <code>FileReader</code> loads it all into memory; stream or slice it.`,`Trusting <code>file.type</code> or the extension for security.`,`Leaking object URLs (no <code>revokeObjectURL</code>).`,`Clipboard reads fail without a secure context, user gesture or permission, and behave differently across browsers.`,`Uploading from mobile networks needs retries and resumability; a single long POST often fails.`],
best:[`Validate on both sides; store uploads outside the web root with generated names; scan and limit sizes.`,`Use pre-signed URLs/multipart uploads for large files so bytes bypass your app server.`,`Provide a keyboard-accessible file input alongside drag and drop, and announce progress/results.`],
iq:[["mid","How do you upload a file with fetch?","Put the File in a FormData and POST it without setting Content-Type (the browser adds the multipart boundary); use an AbortController to cancel; use XHR if you need upload progress."],["senior","How would you implement resumable uploads?","Slice the file into chunks with offsets and checksums, send them sequentially or in parallel, have the server track confirmed ranges, and on failure resume from the last confirmed offset (tus, S3 multipart)."],["senior","Why can't you trust file.type?","It's derived from the file extension on the user's machine and can be spoofed; the server must verify content signatures, limits and scan, and serve downloads with safe headers."]],
practice:[`Build an image upload with preview, size/type validation, drag and drop and a progress bar.`,`Implement chunked upload with retry per chunk and resume against a mock server function.`],
teach:`<p>"A file is a sealed parcel with a label you shouldn't trust. Cut big parcels into numbered pieces so a broken connection only resends the missing part, free the temporary preview addresses, and let the server check the real contents."</p>`}

{n:48,title:"Accessibility and Web Components",goal:"Build for all users and encapsulate reusable UI with the platform's own component model.",topics:[
{id:"d48-a11y",title:"Accessibility beyond widgets: WCAG, focus, contrast",lv:["fresher","mid","senior","lead"],
eli5:`<p>Accessibility means <b>everyone can use the building</b>: people who can't see (screen readers read the page aloud), can't use a mouse (keyboard only), see low contrast poorly, or need more time. It's like building a ramp, clear signs and wide doors from the start instead of adding them later. Using the right HTML elements gives you most of this for free.</p>`,
why:`<p>About one in six people live with a disability, accessibility is a legal requirement in many places, and good accessibility improves usability and SEO for everyone. Senior frontend interviews expect more than "add alt text".</p>`,
tech:`<h5>WCAG principles (POUR)</h5><ul class="pts"><li><b>Perceivable:</b> text alternatives (<code>alt</code>), captions, sufficient contrast, content that doesn't rely on color alone, resizable text.</li><li><b>Operable:</b> everything works with a keyboard, no keyboard traps, visible focus, enough time, no flashing, large enough targets, skip links.</li><li><b>Understandable:</b> clear language, predictable behavior, helpful error messages and labels.</li><li><b>Robust:</b> valid, semantic HTML that works with assistive technology.</li></ul>
<h5>Practical rules</h5><ul class="pts"><li><b>Semantic HTML first</b> (<code>button</code>, <code>a</code>, <code>nav</code>, <code>main</code>, headings in order, <code>label</code>, <code>ul/ol</code>, <code>table</code> with headers). <b>ARIA only when native elements can't do it</b>; "no ARIA is better than bad ARIA".</li><li><b>Accessible name:</b> every control needs one (text content, <code>label</code>, <code>aria-label</code>, <code>aria-labelledby</code>). Icons buttons need names.</li><li><b>Focus management:</b> logical tab order (don't use positive <code>tabindex</code>), visible <code>:focus-visible</code> styles, move focus into dialogs and back to the trigger, to the heading on SPA route changes; <code>inert</code> to disable background content.</li><li><b>Live regions:</b> <code>aria-live="polite"</code> (or <code>role="status"</code>) for non-urgent updates, <code>role="alert"</code> for errors; the region must exist before you change its text.</li><li><b>Contrast:</b> text 4.5:1 (AA), large text (≥ 24px or 18.66px bold) 3:1, UI components and focus indicators 3:1.</li><li><b>Motion and preferences:</b> respect <code>prefers-reduced-motion</code>, <code>prefers-color-scheme</code>, zoom to 200–400%, <code>lang</code> attribute, touch target ≥ 24×24 CSS px (WCAG 2.2) and ideally 44×44.</li><li><b>Testing:</b> keyboard-only pass, screen reader checks (VoiceOver, NVDA, TalkBack), axe/Lighthouse/Playwright accessibility checks in CI (catch ~30–40% of issues; manual testing is required), and real user feedback.</li></ul>`,
diagram:{html:flow([["Semantic HTML","free roles, names, keyboard"],["Labels + names","every control","w"],["Keyboard + focus","visible, logical, managed","w"],["Contrast + motion","4.5:1, reduced motion","g"],["Test","keyboard, screen reader, axe","g"]]),steps:["Choose the right elements; most accessibility problems start with <code>div</code> buttons.","Make sure assistive technology can name and describe every control.","Support keyboard use and manage focus when the UI changes dynamically.","Meet contrast and preference requirements.","Verify with automated tools and manual testing."]},
ex:[{t:"Contrast calculator and a markup audit on a detached DOM (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
const lum = (hex) => { hex = hex.replace("#", ""); if (hex.length === 3) hex = [...hex].map((x) => x + x).join(""); const [r, g, b] = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16)); return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b); };
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
check("black on white is 21:1", ratio("#000", "#fff").toFixed(2) === "21.00");
check("#767676 on white just passes AA for normal text (4.54)", ratio("#767676", "#fff").toFixed(2) === "4.54" && ratio("#767676", "#fff") >= 4.5);
check("#777777 on white just fails AA (4.48)", ratio("#777777", "#fff").toFixed(2) === "4.48" && ratio("#777", "#fff") < 4.5);
check("#949494 passes the 3:1 large-text/UI threshold but not 4.5:1", ratio("#949494", "#fff") >= 3 && ratio("#949494", "#fff") < 4.5);
const audit = (root) => {
  const issues = [];
  root.querySelectorAll("img").forEach((i) => { if (!i.hasAttribute("alt")) issues.push("img missing alt"); });
  root.querySelectorAll("button,a[href]").forEach((e) => { const name = (e.textContent || "").trim() || e.getAttribute("aria-label") || e.getAttribute("title"); if (!name) issues.push(e.tagName.toLowerCase() + " has no accessible name"); });
  root.querySelectorAll("input:not([type=hidden]),select,textarea").forEach((i) => {
    const labelled = i.getAttribute("aria-label") || i.getAttribute("aria-labelledby") || (i.id && root.querySelector('label[for="' + i.id + '"]')) || i.closest("label");
    if (!labelled) issues.push("form control without label");
  });
  const levels = [...root.querySelectorAll("h1,h2,h3,h4,h5,h6")].map((h) => Number(h.tagName[1]));
  for (let i = 1; i < levels.length; i++) if (levels[i] - levels[i - 1] > 1) issues.push("heading level skipped");
  return issues;
};
const doc = document.implementation.createHTMLDocument("");
const bad = doc.createElement("div");
bad.innerHTML = '<h1>Title</h1><h3>Skipped</h3><img src="x.png"><button></button><a href="/x"></a><input id="q">';
const found = audit(bad);
check("the audit finds missing alt, names, label and skipped heading", found.includes("img missing alt") && found.includes("button has no accessible name") && found.includes("a has no accessible name") && found.includes("form control without label") && found.includes("heading level skipped"));
const good = doc.createElement("div");
good.innerHTML = '<h1>Title</h1><h2>Section</h2><img src="x.png" alt=""><button aria-label="Close">×</button><a href="/x">Read more</a><label for="q">Search</label><input id="q">';
check("well-formed markup passes (decorative image uses alt=\\"\\")", audit(good).length === 0);`},
{t:"CSS and focus essentials (reference)",code:`/* Visible focus for keyboard users, not for mouse clicks */
:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }

/* Respect motion preferences */
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* Visually hidden text for screen readers (not display:none) */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

// JS: announce a status message politely
const live = document.getElementById("status");      // <div id="status" role="status" aria-live="polite"></div>
live.textContent = "";                               // clear first so repeated messages are announced
requestAnimationFrame(() => { live.textContent = "3 results found"; });`,run:false}],
gotchas:[`<code>div</code>/<code>span</code> with click handlers aren't focusable or announced as buttons; use <code>button</code>.`,`<code>display:none</code> and <code>visibility:hidden</code> remove content from assistive tech too; use a visually-hidden class for text meant only for screen readers.`,`Removing the focus outline (<code>outline: none</code>) without a replacement makes keyboard use impossible.`,`Placeholder text is not a label; it disappears and has low contrast.`,`Positive <code>tabindex</code> values create confusing tab orders.`,`Automated tools catch only a portion of problems; passing axe doesn't mean accessible.`,`<code>aria-hidden="true"</code> on focusable elements creates "ghost" focus stops.`],
best:[`Start from semantic HTML and test with the keyboard before adding ARIA.`,`Add automated checks (axe, eslint-plugin-jsx-a11y style rules, Playwright) plus manual screen-reader passes on key flows.`,`Include accessibility acceptance criteria in tickets and design reviews.`],
iq:[["fresher","How do you make a custom button accessible?","Use a real button element; if you must use a div, add role=button, tabindex=0, keyboard handlers for Enter and Space, an accessible name and visible focus styles."],["mid","What are the contrast requirements?","WCAG AA: 4.5:1 for normal text, 3:1 for large text and UI components/focus indicators; AAA is 7:1 / 4.5:1."],["senior","How do you handle focus in a single-page app?","On route changes move focus to the new heading or a skip target and update the title; in dialogs trap focus, make the background inert and restore focus to the trigger on close; announce async updates through live regions."],["lead","How do you build accessibility into a team process?","Design-system components with accessibility built in, linting and automated tests in CI, manual audits for critical flows, definition-of-done criteria, training, and tracking issues like any other defects."]],
practice:[`Audit a real page with the keyboard only and with a screen reader; list 10 issues and fix 3.`,`Add a skip link, a live region and a focus-on-route-change behavior to the router from Day 46.`],
teach:`<p>"Accessibility is a ramp and clear signs from the start: use the right HTML elements, give every control a name, make everything work with a keyboard with visible focus, keep text contrast high, announce changes, and test with real assistive tools."</p>`},

{id:"d48-web-components",title:"Web Components and Shadow DOM",lv:["mid","senior","architect"],
eli5:`<p>A web component is a <b>LEGO brick you invent yourself</b>: you give it a new tag name like <code>&lt;x-counter&gt;</code> and any page can use it. <b>Shadow DOM</b> is a <b>sealed box</b> around the brick: its insides (and styles) can't be messed up by the page, and the page's styles can't leak in. <b>Slots</b> are little holes where the page can put its own content.</p>`,
why:`<p>Frameworks come and go; custom elements are a browser standard that works with any framework (or none). They're useful for design systems, widgets embedded in other sites and micro-frontends (Day 29).</p>`,
tech:`<ul class="pts"><li><b>Custom elements:</b> <code>customElements.define("x-counter", class extends HTMLElement {...})</code>; names must contain a hyphen. <b>Lifecycle:</b> <code>constructor</code> (don't read attributes or touch children), <code>connectedCallback</code> (added to DOM: render, add listeners), <code>disconnectedCallback</code> (cleanup), <code>attributeChangedCallback(name, old, new)</code> (for <code>static observedAttributes</code>), <code>adoptedCallback</code>.</li><li><b>Attributes vs properties:</b> attributes are strings in markup; properties are typed JS values. Good components <b>reflect</b> important state to attributes and accept both.</li><li><b>Shadow DOM:</b> <code>this.attachShadow({ mode: "open" })</code> creates an encapsulated subtree: styles don't cross the boundary, <code>querySelector</code> from outside doesn't see inside, IDs are scoped. <b>Closed</b> mode hides <code>shadowRoot</code> (rarely worth it).</li><li><b>Slots:</b> <code>&lt;slot name="title"&gt;</code> projects light-DOM children into the shadow tree; style with <code>::slotted()</code>. <b>Styling hooks:</b> CSS custom properties (inherit through), <code>::part(name)</code> for exposed parts, <code>:host</code>/<code>:host(.class)</code> inside.</li><li><b>Events:</b> events dispatched inside the shadow tree are <b>retargeted</b> at the host; to cross the boundary, use <code>bubbles: true, composed: true</code>.</li><li><b>Templates:</b> <code>&lt;template&gt;</code> content is inert until cloned. <b>Declarative Shadow DOM</b> (<code>&lt;template shadowrootmode="open"&gt;</code>) allows server rendering.</li><li><b>Form-associated custom elements</b> (<code>ElementInternals</code>) participate in forms and validation. <b>Customized built-ins</b> (<code>is="..."</code>) aren't supported in Safari; prefer autonomous elements.</li><li><b>Trade-offs:</b> great isolation and portability; accessibility (names, focus, ARIA across shadow boundaries), SSR/hydration, form participation and theming need deliberate design. Libraries like Lit reduce boilerplate.</li></ul>`,
diagram:{html:lanes([["Light DOM (page)",["&lt;x-counter count='2'&gt;","  Clicks","&lt;/x-counter&gt;"]],["Shadow DOM (inside)",["&lt;button part='btn'&gt;","  &lt;slot&gt;&lt;/slot&gt;: &lt;span&gt;2&lt;/span&gt;","&lt;/button&gt;","own scoped styles"]]]),steps:["The page writes simple markup with your tag name.","The element attaches a shadow root and renders its internals there, isolated from page styles.","Page content passes through <code>&lt;slot&gt;</code> into the shadow tree.","Composed events and CSS custom properties are the supported ways to communicate across the boundary."]},
ex:[{t:"A custom element with Shadow DOM, slots, reflection and events (self-checking)",code:`const check = (name, ok) => console.log((ok ? "pass  " : "FAIL  ") + name);
if (!customElements.get("x-counter")) {
  customElements.define("x-counter", class extends HTMLElement {
    static observedAttributes = ["count"];
    #n = 0;
    constructor(){
      super();
      const sr = this.attachShadow({ mode: "open" });
      sr.innerHTML = '<button part="btn"><slot>Clicks</slot>: <span class="n">0</span></button>';
      sr.querySelector("button").addEventListener("click", () => {
        this.count = this.count + 1;
        this.dispatchEvent(new CustomEvent("change", { detail: this.count, bubbles: true, composed: true }));
      });
    }
    get count(){ return this.#n; }
    set count(v){ this.#n = Number(v) || 0; if (this.getAttribute("count") !== String(this.#n)) this.setAttribute("count", this.#n); this.#render(); }
    attributeChangedCallback(name, _old, v){ if (name === "count" && Number(v) !== this.#n) { this.#n = Number(v) || 0; this.#render(); } }
    connectedCallback(){ this.#render(); }
    #render(){ const s = this.shadowRoot.querySelector(".n"); if (s) s.textContent = this.#n; }
  });
}
const el = document.createElement("x-counter");
check("the element is upgraded and has an encapsulated shadow tree", el.shadowRoot !== null && el.shadowRoot.querySelector("button") !== null);
check("encapsulation: outside queries cannot see shadow internals", el.querySelector("button") === null);
el.count = 2;
check("the property renders and reflects to the attribute", el.shadowRoot.querySelector(".n").textContent === "2" && el.getAttribute("count") === "2");
el.setAttribute("count", "5");
check("an attribute change updates the property", el.count === 5 && el.shadowRoot.querySelector(".n").textContent === "5");
let detail = null; el.addEventListener("change", (e) => (detail = e.detail));
el.shadowRoot.querySelector("button").click();
check("a click inside updates state and fires a composed event outside", el.count === 6 && detail === 6);
el.append("Taps");
check("light-DOM content is projected through the slot", el.shadowRoot.querySelector("slot").assignedNodes().length === 1 && el.shadowRoot.querySelector("slot").assignedNodes()[0].textContent === "Taps");
const host = document.implementation.createHTMLDocument("").createElement("div");
const sr = host.attachShadow({ mode: "open" }); sr.innerHTML = "<p>inside</p>"; host.innerHTML = "<b>light</b>";
check("light and shadow trees are separate", host.children.length === 1 && host.querySelectorAll("p").length === 0 && sr.querySelectorAll("p").length === 1 && host.shadowRoot === sr);
if (!customElements.get("x-life")) {
  customElements.define("x-life", class extends HTMLElement {
    static observedAttributes = ["a"];
    connectedCallback(){ globalThis.__life?.push("connected"); }
    disconnectedCallback(){ globalThis.__life?.push("disconnected"); }
    attributeChangedCallback(n, o, v){ globalThis.__life?.push("attr " + n + "=" + v); }
  });
}
globalThis.__life = [];
const tmp = document.createElement("div"); tmp.hidden = true; document.body.append(tmp);
const life = document.createElement("x-life"); life.setAttribute("a", "1"); tmp.append(life); life.remove(); tmp.remove();
check("lifecycle order: attribute, connected, disconnected", globalThis.__life.join() === "attr a=1,connected,disconnected");
delete globalThis.__life;`}],
gotchas:[`Don't read attributes or add children in the <code>constructor</code>; do it in <code>connectedCallback</code> (the element may be created by the parser before attributes exist).`,`<code>connectedCallback</code> can run multiple times (moving the element); make setup idempotent and clean up in <code>disconnectedCallback</code>.`,`Events don't cross shadow boundaries unless <code>composed: true</code>; event targets are retargeted to the host.`,`Global CSS doesn't style shadow internals; expose theming via CSS custom properties and <code>::part</code>.`,`ARIA relationships (<code>aria-labelledby</code>, <code>for</code>) can't reference IDs across shadow boundaries; use slots, <code>ElementInternals</code> or keep related elements in the same tree.`,`Customized built-in elements (<code>is=</code>) are not supported in Safari.`,`A custom element name can be defined only once per page; re-defining throws.`],
best:[`Use autonomous custom elements; reflect key state to attributes; document events, slots, parts and CSS variables as the public API.`,`Consider Lit or similar for templating and reactivity; test with real browsers (Playwright).`,`Design accessibility explicitly: roles, names, keyboard handling, focus delegation.`],
iq:[["mid","What are Web Components?","A set of browser standards: custom elements, Shadow DOM and templates/slots, for creating reusable, encapsulated elements usable in any framework."],["senior","How does Shadow DOM encapsulation work, and how do you theme a component?","It isolates DOM and styles in a separate tree; outside CSS can't reach in. Expose theming through CSS custom properties (inherit across the boundary) and ::part, and slots for content."],["architect","When would you choose Web Components over a framework component library?","For design systems used across frameworks and teams, embeddable widgets, and micro-frontends needing isolation; stay with the framework when you need tight SSR/hydration, ecosystem tooling and simpler state integration."]],

teach:`<p>"A web component is a LEGO brick you invent with your own tag. Shadow DOM seals its insides from page styles, slots let the page drop content in, and composed events let it talk back out."</p>`}
