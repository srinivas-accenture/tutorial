["Call stack","The structure that tracks which function is running and where to return. One stack per thread."],
["Closure","A function plus a live reference to the variables of the scope where it was created."],
["Coercion","Automatic or explicit conversion of a value from one type to another."],
["Event loop","The mechanism that takes tasks from queues and runs them one at a time on the call stack, draining microtasks between tasks."],
["Hoisting","Declarations are registered when a scope is created, before any line of that scope runs."],
["Hidden class (Map/shape)","V8's internal description of an object's property layout, shared by objects built the same way."],
["Inline cache","A per-call-site cache of the shapes seen, used to make property access fast."],
["Microtask","A small job (promise reaction, queueMicrotask) that runs as soon as the stack is empty, before the next task."],
["Prototype","The object another object delegates to when a property is not found on itself."],
["Reflow (layout)","Recomputing sizes and positions of elements."],
["Repaint","Redrawing pixels without recomputing layout."],
["Temporal dead zone","The span between entering a scope and the line that initializes a let, const or class binding. Access throws."],
["Tree-shaking","Removing unused exports from a bundle using static import/export analysis."],
["Hydration","Attaching JavaScript behavior to server-rendered HTML."],
["Backpressure","A consumer signalling a producer to slow down so memory does not grow without bound."],
["Origin","Scheme + host + port. The unit of the same-origin policy."],
