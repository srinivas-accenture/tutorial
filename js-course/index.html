<h1>JavaScript, from your first variable to system architecture.</h1>
<p>Sixty-five days: a 30-day core course, a 10-day interview bootcamp, 15 days of platform, backend and engineering depth, and 10 days of HTML &amp; CSS and TypeScript, in thirteen weekly pages and 139 topics. Every topic has an <b>Explain like I’m 5</b> tab and a <b>Technical</b> tab, a diagram, runnable examples, edge cases, interview questions with model answers, and a two-minute “teach it” script.</p>
<a class="cta" id="start" href="#d1-intro">Start at Day 1</a><a class="cta alt" id="cont" href="#" hidden>Continue where you left off</a><a class="cta alt" href="#ladder">Career ladder</a><a class="cta alt" href="#glossary">Glossary</a>
</div>
<h2>How to use this course</h2>
<ul class="pts">
<li><b>Read the 5-year-old tab first.</b> If you can say the analogy out loud, you own the mental model. Then read the Technical tab for the exact behavior.</li>
<li><b>Press ▶ Run on every example</b> after predicting the output. The code runs live in your browser.</li>
<li><b>Do the tricky-output quiz</b> at the end of each day before moving on. These are the questions interviewers actually ask.</li>
<li><b>Tick the day complete</b> only when you can teach it using the “Teach it in 2 minutes” box. Progress is saved in this browser.</li>
<li><b>Version note:</b> language status is as of November 2026 (ES2026 published; Temporal and <code>using</code> expected in ES2027; decorators still a proposal). Browser support figures change, so check MDN before relying on a specific version number.</li>
<li><b>Weeks 7–8 are the interview bootcamp:</b> coding rounds (polyfills, async, algorithms, UI) and architecture rounds (system design, real-time, performance, behavioral). Every solution there is runnable and ships with self-checks that print pass/FAIL.</li>
<li><b>Weeks 9–11 fill the remaining gaps</b> (OOP and SOLID, functional programming, algorithms, binary data and Intl, debugging, routing, forms, accessibility, Web Components, authentication, Node APIs, databases, caching, Git/CI, deployment, WebAssembly, ASTs).</li>
<li><b>Weeks 12–13 add the neighbouring technologies:</b> HTML &amp; CSS foundations (semantics, the cascade, Flexbox, Grid, responsive and modern CSS) and TypeScript (types, narrowing, generics, advanced types, tsconfig and migration). New to the web? You can read Week 12 alongside Week 4. React has its own course: <a href="../react-course/index.html">React: Zero to Architect</a>.</li>
<li>A <b>revision sheet</b> closes every week. Use <b>Print</b> (Ctrl/Cmd+P) to get a clean copy with both explanation styles expanded.</li>
</ul>
